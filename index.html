<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyOS — Financial Command Center</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0f">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="boot-gate"></div>

<div class="app" id="app-root" style="display:none">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebarMobile()"></div>

  <nav class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-text">MoneyOS</div>
      <div class="logo-sub">Financial Command</div>
    </div>
    <div class="health-score"><div class="score" id="health-score-val">—</div><div class="label">Health Score</div></div>
    <div class="nav" id="nav"></div>
  </nav>

  <main class="main" id="main-scroll">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" onclick="openSidebar()" aria-label="Open menu">☰</button>
      </div>
      <div class="topbar-right">
        <div class="date-badge" id="current-date"></div>
        <div class="notif-btn" onclick="toggleNotifPanel()">🔔<div class="notif-dot" id="notif-dot"></div></div>
        <div class="notif-panel" id="notif-panel"></div>
      </div>
    </div>
    <div id="page-content"></div>
  </main>
</div>

<div id="modal-overlay"></div>

<script src="/js/crypto.js"></script>
<script src="/js/webauthn.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/app.js"></script>
<script src="/js/app-pages.js"></script>
<script src="/js/app-init.js"></script>
</body>
</html>
